<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Vanish — chat that burns away</title>

<!-- PWA: installable as a home-screen app -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#10131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanish">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0a12;
    --panel:#171220;
    --panel-2:#1e1829;
    --ember:#ff6a4d;
    --ember-2:#ffb238;
    --ember-dim:#c14e39;
    --ash:#9c90ad;
    --paper:#f4ede8;
    --line:#312a3f;
    --good:#3ddc84;
    --danger:#ff5f70;
    --gradient:linear-gradient(135deg, var(--ember) 0%, var(--ember-2) 100%);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% -8%, rgba(255,106,77,0.14) 0%, transparent 42%),
      radial-gradient(circle at 92% 108%, rgba(255,178,56,0.10) 0%, transparent 40%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    /* dvh tracks the *visible* viewport, so the composer isn't pushed under
       the on-screen keyboard or the collapsing mobile browser bar. Declared
       after the vh line so old engines keep the fallback. */
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    /* Stop the whole page rubber-banding / pull-to-refresh on touch — a chat
       that bounces away under your thumb reads as a website, not an app. */
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  .landing{
    width:100%;
    max-width:340px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:40px 30px 32px;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .landing::before{
    content:"";
    position:absolute;
    top:-45%; right:-30%;
    width:280px; height:280px;
    background:radial-gradient(circle, rgba(255,106,77,0.20), transparent 70%);
    pointer-events:none;
  }
  .brand-row{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:30px;}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 18px -4px rgba(255,106,77,0.55);
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand{
    font-family:'Space Mono',monospace;
    font-size:16px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    background:var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  label{
    display:block;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--ash);margin-bottom:8px;margin-top:20px;font-weight:600;
  }
  label:first-of-type{margin-top:0;}
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;color:var(--paper);font-family:'Inter',sans-serif;font-size:16px;
    outline:none;transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,106,77,0.16);}
  .hint{font-size:12px;color:var(--ash);margin-top:7px;line-height:1.5;}
  .btn{
    margin-top:28px;width:100%;background:var(--gradient);border:none;border-radius:12px;
    color:#20100a;font-weight:700;font-size:15px;padding:14px;cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
    box-shadow:0 10px 24px -8px rgba(255,106,77,0.5);
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  .chatwrap{
    width:100%;max-width:560px;height:88vh;max-height:760px;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;display:none;flex-direction:column;overflow:hidden;
    position:relative;box-shadow:0 30px 70px -25px rgba(0,0,0,0.65);
  }
  .chatwrap.active{display:flex;}
  .landing.hidden{display:none;}

  header.chatbar{
    padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;background:var(--panel-2);gap:12px;
  }
  .chatbar-left{display:flex;align-items:center;gap:11px;min-width:0;}
  .peer-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:var(--gradient);color:#20100a;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:15px;
    box-shadow:0 0 0 2px var(--panel-2), 0 0 0 3.5px rgba(255,106,77,0.4);
  }
  .chatbar-text{min-width:0;display:flex;flex-direction:column;gap:1px;}
  .room-tag{
    font-family:'Space Mono',monospace;font-size:13.5px;color:var(--paper);letter-spacing:0.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  }
  .room-sub{
    font-size:11px;color:var(--ash);display:flex;align-items:center;gap:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);
    flex-shrink:0;cursor:default;
  }
  .status-dot.offline{background:var(--ash);box-shadow:none;}
  .toolbar{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .icon-btn{
    background:none;border:none;color:var(--ash);width:38px;height:38px;border-radius:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.06);color:var(--paper);}
  .icon-btn.on{color:var(--ember);background:rgba(255,106,77,0.14);}
  .icon-btn svg{width:18px;height:18px;}
  .toolbar-divider{width:1px;height:22px;background:var(--line);margin:0 4px;}

  /* ---------- Call overlay ---------- */
  .call-overlay{
    position:absolute;inset:0;background:rgba(9,7,13,0.97);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;z-index:20;padding:24px;text-align:center;
  }
  .call-overlay.show{display:flex;}
  .call-avatar{
    width:88px;height:88px;border-radius:50%;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;
    font-size:30px;color:#20100a;
  }
  .call-avatar.pulse{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,106,77,0.35);}
    50%{box-shadow:0 0 0 16px rgba(255,106,77,0);}
  }
  .call-name{font-family:'Space Mono',monospace;font-size:18px;}
  .call-status{font-size:13px;color:var(--ash);}
  .call-timer{font-family:'Space Mono',monospace;font-size:13px;color:var(--good);}
  .call-video-wrap{position:relative;width:100%;height:100%;display:none;}
  .call-video-wrap.show{display:block;}
  video.remote-video{width:100%;height:100%;object-fit:cover;border-radius:16px;background:#000;}
  video.local-video{
    position:absolute;bottom:18px;right:18px;width:110px;height:82px;object-fit:cover;
    border-radius:10px;border:1px solid var(--line);background:#000;
  }
  .call-controls{display:flex;gap:16px;align-items:center;z-index:1;}
  .call-btn{
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease;
  }
  .call-btn:active{transform:scale(0.92);}
  .call-btn.mute-tgl, .call-btn.cam-tgl{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);}
  .call-btn.mute-tgl.off, .call-btn.cam-tgl.off{background:var(--gradient);color:#20100a;border-color:transparent;}
  .call-btn.hangup{background:var(--danger);color:#fff;}
  .call-btn.accept{background:var(--good);color:#0c1a12;}
  .call-btn.decline{background:var(--danger);color:#fff;}
  .call-controls-row{display:flex;gap:20px;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1;}

  .incoming-actions{display:flex;gap:22px;}
  #outgoingControls, #incomingControls, #connectedControls{display:none;}
  #outgoingControls.show, #incomingControls.show, #connectedControls.show{display:flex;}
  #callAudioUi{display:flex;flex-direction:column;align-items:center;gap:14px;}

  .toast{
    position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);
    background:var(--panel-2);border:1px solid var(--ember-dim);border-radius:12px;padding:10px 16px;
    font-size:13px;color:var(--paper);opacity:0;pointer-events:none;transition:all .25s ease;z-index:5;
    max-width:80%;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .messages{
    flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:11px;
    /* Keep momentum scrolling inside the list and stop a scroll that hits the
       end from chaining out to the page behind it. */
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    background:
      radial-gradient(circle at 20% 8%, rgba(255,106,77,0.045) 0%, transparent 34%),
      radial-gradient(circle at 82% 82%, rgba(255,178,56,0.04) 0%, transparent 34%);
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .empty{margin:auto;text-align:center;color:var(--ash);font-size:13px;line-height:1.7;}
  .empty .big{font-family:'Space Mono',monospace;font-size:15px;color:var(--paper);display:block;margin-bottom:4px;}

  .msg{max-width:78%;display:flex;flex-direction:column;gap:5px;position:relative;}
  .msg.mine{align-self:flex-end;align-items:flex-end;}
  .msg.theirs{align-self:flex-start;align-items:flex-start;}
  .msg-status{font-size:10px;color:var(--ash);font-family:'Space Mono',monospace;margin-top:2px;margin-right:2px;}
  .meta{font-size:10.5px;color:var(--ash);font-family:'Space Mono',monospace;display:flex;align-items:center;gap:7px;}
  .reply-btn{
    background:none;border:none;color:var(--ash);font-size:11px;cursor:pointer;padding:0;
    opacity:0;transition:opacity .15s ease;font-family:'Inter',sans-serif;
  }
  .msg:hover .reply-btn{opacity:1;}
  .reply-btn:hover{color:var(--ember);}
  .quote{
    font-size:12px;color:var(--ash);border-left:2px solid var(--ember);padding:4px 10px;
    margin-bottom:2px;border-radius:6px;background:rgba(255,106,77,0.08);max-width:100%;
  }
  .quote b{color:var(--paper);}
  .bubble{
    padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.48;
    word-wrap:break-word;white-space:pre-wrap;
  }
  .msg.mine .bubble{background:var(--gradient);color:#20100a;border-bottom-right-radius:5px;font-weight:500;}
  .msg.theirs .bubble{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:5px;}

  .fuse{width:100%;height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .fuse-fill{height:100%;background:var(--gradient);width:0%;}

  .reply-preview{
    display:none;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 16px;background:var(--panel-2);border-top:1px solid var(--line);
  }
  .reply-preview.show{display:flex;}
  .reply-preview .info{font-size:12px;color:var(--ash);border-left:2px solid var(--ember);padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reply-preview .info b{color:var(--paper);}
  .reply-preview button{background:none;border:none;color:var(--ash);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0;}
  .reply-preview button:hover{color:var(--paper);}

  form.composer{display:flex;gap:7px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel-2);position:relative;}
  .composer input[type=file]{display:none;}
  .composer-icon-btn{
    background:none;border:none;color:var(--ash);width:38px;height:38px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .15s ease;
  }
  .composer-icon-btn:hover{background:rgba(255,255,255,0.06);color:var(--paper);}
  .composer-icon-btn svg{width:20px;height:20px;}
  .input-wrap{
    flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:22px;
    display:flex;align-items:center;padding-right:6px;transition:border-color .15s ease;
  }
  .input-wrap:focus-within{border-color:var(--ember);}
  .input-wrap .composer-icon-btn{width:32px;height:32px;}
  .composer input[type=text]{
    flex:1;min-width:0;background:none;border:none;padding:11px 17px;color:var(--paper);
    /* Must stay >=16px: iOS auto-zooms the entire page when you focus an
       input with a smaller font, which leaves the chat scrolled sideways. */
    font-size:16px;outline:none;
  }
  .send{
    background:var(--gradient);border:none;color:#20100a;width:42px;height:42px;border-radius:50%;
    font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:filter .15s ease, transform .1s ease;box-shadow:0 6px 16px -6px rgba(255,106,77,0.6);
  }
  .send:hover{filter:brightness(1.08);}
  .send:active{transform:scale(0.94);}

  .emoji-panel{
    position:absolute;bottom:64px;right:55px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:14px;padding:10px;display:none;grid-template-columns:repeat(6,1fr);gap:2px;
    width:252px;z-index:15;box-shadow:0 14px 32px rgba(0,0,0,0.45);
  }
  .emoji-panel.show{display:grid;}
  .emoji-panel button{
    background:none;border:none;font-size:20px;padding:6px;border-radius:9px;cursor:pointer;
    line-height:1;
  }
  .emoji-panel button:hover{background:rgba(255,255,255,0.08);}

  .bubble.has-image{padding:5px;}
  .msg-image{
    max-width:230px;max-height:300px;width:100%;border-radius:12px;display:block;
    cursor:pointer;object-fit:cover;
  }
  .caption{padding:7px 6px 3px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;}
  .img-sending{opacity:0.55;}

  .composer-icon-btn.mic-btn.active{background:var(--danger);color:#fff;}
  .composer-icon-btn.rec-cancel-btn{display:none;color:var(--danger);}
  .composer.recording .rec-cancel-btn{display:flex;}
  .composer.recording #attachBtn, .composer.recording #emojiBtn, .composer.recording .send{display:none;}
  .composer.recording .input-wrap{display:none;}
  .recording-indicator{
    display:none;align-items:center;gap:9px;flex:1;min-width:0;padding:0 6px;
  }
  .composer.recording .recording-indicator{display:flex;}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:recBlink 1s ease-in-out infinite;}
  @keyframes recBlink{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .rec-timer{font-family:'Space Mono',monospace;font-size:13.5px;color:var(--paper);flex-shrink:0;}
  .rec-label{color:var(--ash);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- message action menu (delete for me / everyone) ---------- */
  .menu-btn{
    background:none;border:none;color:var(--ash);font-size:15px;cursor:pointer;padding:0 2px;
    line-height:1;flex-shrink:0;
  }
  .menu-btn:hover{color:var(--paper);}
  .msg-menu{
    display:none;position:absolute;top:22px;z-index:8;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;min-width:168px;box-shadow:0 14px 30px rgba(0,0,0,0.45);
  }
  .msg.mine .msg-menu{right:0;}
  .msg.theirs .msg-menu{left:0;}
  .msg-menu.show{display:block;}
  .msg-menu-item{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--paper);
    padding:11px 14px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .msg-menu-item:hover{background:rgba(255,255,255,0.07);}
  .msg-menu-item.danger{color:var(--danger);}

  /* ---------- voice message bubble ---------- */
  .bubble.has-audio{display:flex;align-items:center;gap:10px;padding:8px 10px;min-width:210px;}
  .voice-player audio{display:none;}
  .voice-play-btn{
    width:34px;height:34px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .msg.mine .voice-play-btn{background:#20100a;color:var(--ember-2);}
  .msg.theirs .voice-play-btn{background:var(--gradient);color:#20100a;}
  .voice-play-btn:disabled{opacity:0.5;cursor:default;}
  .voice-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .voice-track{height:4px;border-radius:2px;background:rgba(0,0,0,0.18);cursor:pointer;position:relative;overflow:hidden;}
  .msg.theirs .voice-track{background:rgba(255,255,255,0.14);}
  .voice-track-fill{height:100%;width:0%;}
  .msg.mine .voice-track-fill{background:#20100a;}
  .msg.theirs .voice-track-fill{background:var(--gradient);}
  .voice-time{font-family:'Space Mono',monospace;font-size:11px;}
  .msg.mine .voice-time{color:#3d2013;}
  .msg.theirs .voice-time{color:var(--ash);}

  .lightbox{
    position:fixed;inset:0;background:rgba(6,5,9,0.94);display:none;
    align-items:center;justify-content:center;z-index:60;padding:28px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;}
  .lightbox-close{
    position:absolute;top:20px;right:20px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--paper);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){ .fuse-fill{transition:none !important;} }

  /* ---- Phone layout ----------------------------------------------------
     On a phone the chat should own the whole screen like an app, instead of
     floating as an 88vh card inside a 20px-padded page. The :has() rule only
     drops the page padding once the chat is open, so the landing card stays
     centred with its breathing room. env(safe-area-inset-*) keeps the header
     clear of the notch and the composer clear of the home indicator — those
     read as zero on devices without insets, so this is safe everywhere. */
  @media (max-width:600px){
    body:has(.chatwrap.active){padding:0;align-items:stretch;}
    .chatwrap{
      max-width:none;height:100dvh;max-height:none;
      border:none;border-radius:0;box-shadow:none;
    }
    header.chatbar{
      padding-top:calc(13px + env(safe-area-inset-top));
      padding-left:calc(18px + env(safe-area-inset-left));
      padding-right:calc(18px + env(safe-area-inset-right));
    }
    form.composer{
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      padding-left:calc(14px + env(safe-area-inset-left));
      padding-right:calc(14px + env(safe-area-inset-right));
    }
    .call-overlay{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
    /* 38px taps are under the 44px minimum both platforms ask for. */
    .composer-icon-btn{width:44px;height:44px;}
    .input-wrap .composer-icon-btn{width:38px;height:38px;}
    .send{width:46px;height:46px;}
    .emoji-panel{right:12px;left:12px;width:auto;grid-template-columns:repeat(8,1fr);}
  }
</style>
</head>
<body>

  <div class="landing" id="landing">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--ink)"><path d="M12 2c2 3 4.5 5 4.5 8.5a4.5 4.5 0 0 1-9 0c0-1.3.5-2.3 1.2-3.3.2 1 .9 1.6 1.6 1.6.9 0 1-1 .7-1.8-.5-1.3-.4-2.9 1-5z"/></svg>
      </div>
      <div class="brand">Vanish</div>
    </div>

    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Sam" maxlength="24">

    <label for="roomInput">Room code</label>
    <input type="text" id="roomInput" placeholder="a word only you two know" maxlength="40">

    <button class="btn" id="enterBtn">Enter room</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="chatwrap" id="chatwrap">
    <header class="chatbar">
      <div class="chatbar-left">
        <div class="peer-avatar" id="peerAvatar">V</div>
        <div class="chatbar-text">

  const ICE_SERVERS = [

  function slugRoom(r){ return r.trim().toLowerCase().replace(/\s+/g,'-').slice(0,60); }

  async function fetchMessages(){
    try{
      const res = await fetch('/api/messages?room=' + encodeURIComponent(room));
      if(!res.ok) return [];
      return await res.json();
    }catch(e){ return []; }

  async function postMessage(text, replyTo, image, audio, audioDuration){
    const controller = new AbortController();
    // A stalled connection can otherwise leave fetch() pending forever,
    // which is what makes a bubble get stuck on "Sending…" with no way
    // out. Capping it means a slow/dead connection becomes a visible,
    // recoverable error instead of an infinite spinner.
    const timeoutId = setTimeout(() => controller.abort(), 20000);
    try{
      const res = await fetch('/api/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({room, sender: myName, text, replyTo: replyTo || null, image: image || null, audio: audio || null, audioDuration: audioDuration || null}),
        signal: controller.signal
      });
      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        return { error: err.error || 'Failed to send' };
      }
      return await res.json();
    }catch(e){
      if(e.name === 'AbortError') return { error: 'Timed out — check your connection and try again' };
      return { error: 'Failed to send' };
    }finally{
      clearTimeout(timeoutId);
    }
  }

  function loadHiddenLocalIds(){

  function saveHiddenLocalIds(){
    try{
      localStorage.setItem('vanish:hidden:' + room, JSON.stringify(Array.from(hiddenLocalIds)));

  function removeRenderedMessage(id){
    const el = messagesEl.querySelector('[data-id="' + String(id).replace(/"/g,'') + '"]');

  function formatLastSeen(lastSeen, online) {
    if (online) return 'Active now';
    if (!lastSeen) return 'Vanishes after 1 hour';
    const diffMs = Date.now() - lastSeen;
    const diffSec = Math.floor(diffMs / 1000);
    if (diffSec < 60) return 'Active now';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return `Active ${diffMin}m ago`;
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return `Active ${diffHr}h ago`;
    const diffDays = Math.floor(diffHr / 24);
    return `Active ${diffDays}d ago`;
  }

  async function pollPresence() {
    if (!room || !myName) return;
    try {
      // 1. Post heartbeat
      await fetch('/api/presence', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room, sender: myName })
      });

      // 2. Fetch presence
      const res = await fetch('/api/presence?room=' + encodeURIComponent(room));
      if (!res.ok) return;
      const data = await res.json();

      // 3. Find the peer. `vanish:participants:<room>` is an append-only set,
      // so it also holds every name that ever joined — a typo, an old
      // nickname, someone who dropped in once. Taking the first non-me entry
      // meant SMEMBERS order decided whose name and status the header showed,
      // which is how a room ends up permanently labelled with a stale name
      // and "Active 3d ago". Prefer whoever is actually online, then fall
      // back to the most recently seen.
      const others = data.users.filter(u => u.name !== myName);
      const peer = others.find(u => u.online)
        || others.slice().sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0))[0]
        || null;
      const statusDot = document.getElementById('statusDot');
      const statusTextEl = document.getElementById('statusText');

      if (peer) {
        roomLabel.textContent = peer.name;
        peerAvatar.textContent = peer.name.charAt(0).toUpperCase();
        
        const statusText = formatLastSeen(peer.lastSeen, peer.online);
        if (statusTextEl) {
          statusTextEl.textContent = statusText;
        }
        if (statusDot) {
          statusDot.classList.toggle('offline', !peer.online);
          statusDot.title = peer.online ? 'Online' : 'Last seen ' + fmtClock(peer.lastSeen);
        }
      } else {
        // Fallback
        roomLabel.textContent = room;
        peerAvatar.textContent = room.charAt(0).toUpperCase();
        if (statusTextEl) {
          statusTextEl.textContent = 'Vanishes after 1 hour';
        }
        if (statusDot) {
          statusDot.classList.add('offline');
          statusDot.title = 'Messages vanish 1 hour after they\'re sent';
        }
      }
    } catch (e) { /* ignore */ }
  }

    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for(let i = 0; i < rawData.length; ++i){
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Registers this device to receive push notifications for `room` as
  // `myName`, even if the app is closed or the phone is locked. Requires:
  //  - HTTPS (Vercel gives you this automatically)
  //  - VAPID_PUBLIC_KEY set above, matching the server env vars
  //  - On iPhone: the app must be added to the Home Screen and opened from
  //    that icon (not a Safari tab), iOS 16.4+.
  async function subscribeForPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      return false; // browser doesn't support push at all
    }
    if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.indexOf('PASTE_YOUR') === 0){
      return false; // server owner hasn't configured push yet
    }
    try{
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room, sender: myName, subscription: sub })
      });
      // Without this check the bell reports "Notifications on" even when the
      // server never stored the subscription (endpoint missing, Redis env
      // vars unset, etc.), so push silently never arrives.
      if(!res.ok) return false;
      return true;
    }catch(e){
      console.error('push subscribe failed', e);
      return false;
    }
  }

  async function unsubscribeFromPush(){
    try{
      if('serviceWorker' in navigator){
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if(sub) await sub.unsubscribe();
      }
      await fetch('/api/subscribe', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room, sender: myName })
      });
    }catch(e){ /* ignore */ }
  }

  const MAX_IMAGE_DATA_URL_LEN = 650000; // keep well under Upstash's request-size limit

  function compressImageFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode failed'));
        img.onload = () => {
          const MAX_DIM = 1280;
          let { width, height } = img;
          if(width > MAX_DIM || height > MAX_DIM){
            if(width > height){
              height = Math.round(height * (MAX_DIM / width));
              width = MAX_DIM;
            }else{
              width = Math.round(width * (MAX_DIM / height));
              height = MAX_DIM;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.75;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          let tries = 0;
          while(dataUrl.length > MAX_IMAGE_DATA_URL_LEN && tries < 6 && quality > 0.2){
            quality -= 0.12;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
            tries++;
          }
          if(dataUrl.length > MAX_IMAGE_DATA_URL_LEN){
            reject(new Error('too large'));
            return;
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const MAX_AUDIO_BYTES = 520000;        // raw recording cap before base64 (~520KB)
  const MAX_AUDIO_DATA_URL_LEN = 750000; // final data URL cap (matches server-side check)
  const MAX_RECORD_MS = 120000;          // 2 minute safety cap

  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStream = null;
  let recordingStartTs = null;
  let recordingTimerInterval = null;
  let recordingAutoStopTimer = null;
  let isRecording = false;

  function fmtDuration(s){
    s = Math.max(0, Math.floor(s || 0));
    const mm = Math.floor(s / 60);
    const ss = String(s % 60).padStart(2, '0');
    return mm + ':' + ss;
  }

  function stopMediaTracks(){

  async function startVoiceRecording(){
    if(isRecording) return;
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
      showToast('This browser can\'t record audio');
      return;
    }
    unlockAudio();
    try{
      recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(e){
      showToast('Couldn\'t access microphone — check permissions');
      return;
    }

    recordedChunks = [];
    let mimeType = '';
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    for(const c of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){
        mimeType = c;
        break;
      }
    }
    try{
      mediaRecorder = mimeType ? new MediaRecorder(recordingStream, { mimeType }) : new MediaRecorder(recordingStream);
    }catch(e){
      showToast('Could not start recording');
      stopMediaTracks();
      return;
    }
    mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };

    mediaRecorder.start();
    recordingStartTs = Date.now();
    setRecordingUI(true);
    updateRecordingTimer();
    recordingTimerInterval = setInterval(updateRecordingTimer, 250);

    recordingAutoStopTimer = setTimeout(() => {
      if(isRecording){
        showToast('Max recording length reached');
        finishRecording();
      }
    }, MAX_RECORD_MS);
  }

  function cancelVoiceRecording(){
    if(!isRecording) return;
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.onstop = null;
      try{ mediaRecorder.stop(); }catch(e){}
    }
    stopMediaTracks();
    clearInterval(recordingTimerInterval);
    clearTimeout(recordingAutoStopTimer);
    recordedChunks = [];
    setRecordingUI(false);
  }

  function blobToDataUrl(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  async function finishRecording(){
    if(!isRecording || !mediaRecorder || mediaRecorder.state === 'inactive') return;
    const durationSec = Math.max(1, Math.round((Date.now() - recordingStartTs) / 1000));

    await new Promise((resolve) => {
      mediaRecorder.onstop = resolve;
      try{ mediaRecorder.stop(); }catch(e){ resolve(); }
    });

    stopMediaTracks();
    clearInterval(recordingTimerInterval);
    clearTimeout(recordingAutoStopTimer);
    setRecordingUI(false);

    if(!recordedChunks.length){
      showToast('Recording was empty');
      return;
    }
    const blob = new Blob(recordedChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
    recordedChunks = [];

    if(blob.size > MAX_AUDIO_BYTES){
      showToast('That recording is too long — try a shorter one');
      return;
    }

    let dataUrl;
    try{
      dataUrl = await blobToDataUrl(blob);
    }catch(e){
      showToast('Could not process that recording');
      return;
    }
    if(dataUrl.length > MAX_AUDIO_DATA_URL_LEN){
      showToast('That recording is too long — try a shorter one');
      return;
    }

    await sendVoiceMessage(dataUrl, durationSec);
  }

      addBubble(result);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

    if(isSending){
      playBtn.disabled = true;
      return wrap;
    }

    playBtn.addEventListener('click', () => {
      if(audioEl.paused){
        document.querySelectorAll('.voice-player audio').forEach(a => { if(a !== audioEl && !a.paused) a.pause(); });
        audioEl.play().catch(() => { showToast('Could not play that voice message'); });
      }else{

    });
    audioEl.addEventListener('play', () => { playBtn.innerHTML = ICON_VOICE_PAUSE; });
    audioEl.addEventListener('pause', () => { playBtn.innerHTML = ICON_VOICE_PLAY; });
    audioEl.addEventListener('ended', () => {
      playBtn.innerHTML = ICON_VOICE_PLAY;
      fill.style.width = '0%';
      timeEl.textContent = '0:00 / ' + fmtDuration(durationSec);
    });
    audioEl.addEventListener('timeupdate', () => {
      const dur = (audioEl.duration && isFinite(audioEl.duration)) ? audioEl.duration : durationSec;
      const frac = dur ? Math.min(1, audioEl.currentTime / dur) : 0;
      fill.style.width = (frac * 100) + '%';
      timeEl.textContent = fmtDuration(audioEl.currentTime) + ' / ' + fmtDuration(dur);
    });
    track.addEventListener('click', (e) => {
      const rect = track.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      const dur = (audioEl.duration && isFinite(audioEl.duration)) ? audioEl.duration : durationSec;
      if(dur) audioEl.currentTime = frac * dur;
    });

    return wrap;
  }

  }

  function createPeerConnection(){
    const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    conn.onicecandidate = (e) => {
      if(e.candidate){
        sendSignal('candidate', { candidate: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate });
      }
    };
    conn.ontrack = (e) => {
      const stream = e.streams[0];
      if(callTypeActive === 'video'){
        remoteVideo.srcObject = stream;
      }else{
        remoteAudio.srcObject = stream;
      }
    };
    conn.onconnectionstatechange = () => {
      if(conn.connectionState === 'connected' && callState !== 'connected'){
        callState = 'connected';
        stopRingback();
        callStatus.textContent = 'Connected';
        setPanel(callTypeActive === 'video' ? null : connectedControls);
        if(callTypeActive === 'video'){
          callVideoWrap.classList.add('show');
          callAudioUi.style.display = 'none';
        }
        startCallTimer();
      }
      if(conn.connectionState === 'failed' && callState !== 'idle'){
        showToast('Call failed — check your connection and try again');
        endCall(false);
      }
      if(conn.connectionState === 'disconnected' && callState !== 'idle'){
        // Give it a few seconds to recover on its own (common on flaky
        // mobile connections) before treating it as a dropped call.
        callStatus.textContent = 'Reconnecting…';
        setTimeout(() => {
          if(pc === conn && (conn.connectionState === 'disconnected' || conn.connectionState === 'failed')){
            showToast('Call ended — connection lost');
            endCall(false);
          }
        }, 6000);
      }
      if(conn.connectionState === 'closed' && callState !== 'idle'){
        showToast('Call ended');
        endCall(false);
      }
    };
    return conn;
  }

  async function getMedia(type){
    const constraints = type === 'video'
      ? { audio: true, video: { width: 480, height: 360 } }
      : { audio: true, video: false };
    return navigator.mediaDevices.getUserMedia(constraints);
  }

  async function startOutgoingCall(type){
    if(callState !== 'idle'){ showToast('Already in a call'); return; }
    unlockAudio();
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
      showToast('This browser/site can\'t access mic or camera (needs HTTPS).');
      return;
    }
    currentCallId = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    callDirection = 'outgoing';
    callState = 'calling';
    callTypeActive = type;
    seenSignalIds = new Set();

    callName.dataset.other = '';
    callName.textContent = 'Calling…';
    callStatus.textContent = type === 'video' ? 'Video call' : 'Voice call';
    callAvatar.innerHTML = callIcon(type);
    callAvatar.classList.add('pulse');
    callVideoWrap.classList.remove('show');
    callAudioUi.style.display = 'flex';
    setPanel(outgoingControls);
    showOverlay();
    startRingback();

    try{
      localStream = await getMedia(type);
    }catch(e){
      showToast('Couldn\'t access mic/camera — check browser permissions.');
      resetCallUI();
      return;
    }
    if(type === 'video'){ localVideo.srcObject = localStream; }

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal('offer', { sdp: offer, callType: type });

    callTimeoutTimer = setTimeout(() => {
      if(callState === 'calling'){
        showToast('No answer');
        sendSignal('hangup');
        endCall(false);
      }
    }, 45000);
  }

  function showIncomingCall(sig){
    incomingOfferSig = sig;
    currentCallId = sig.callId;
    callDirection = 'incoming';
    callState = 'ringing';
    callTypeActive = sig.callType || 'audio';

    callName.dataset.other = sig.sender;
    callName.textContent = sig.sender;
    callStatus.textContent = (callTypeActive === 'video' ? 'Video call' : 'Voice call') + ' — incoming';
    callAvatar.innerHTML = callIcon(callTypeActive);
    callAvatar.classList.add('pulse');
    callVideoWrap.classList.remove('show');
    callAudioUi.style.display = 'flex';
    setPanel(incomingControls);
    showOverlay();
    startRingback();
    beep();

    callTimeoutTimer = setTimeout(() => {
      if(callState === 'ringing'){
        endCall(false);
      }
    }, 45000);
  }

  async function acceptIncomingCall(){
    if(!incomingOfferSig) return;
    unlockAudio();
    clearTimeout(callTimeoutTimer);
    stopRingback();
    callStatus.textContent = 'Connecting…';

    try{
      localStream = await getMedia(callTypeActive);
    }catch(e){
      showToast('Couldn\'t access mic/camera — check browser permissions.');
      sendSignal('decline');
      endCall(false);
      return;
    }
    if(callTypeActive === 'video'){ localVideo.srcObject = localStream; }

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(incomingOfferSig.sdp));
    for(const c of pendingCandidates){
      try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    }
    pendingCandidates = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal('answer', { sdp: answer });
    incomingOfferSig = null;
  }

  function declineIncomingCall(){
    sendSignal('decline');
    endCall(false);
  }

  function endCall(notifyPeer){
    if(notifyPeer && callState !== 'idle'){
      sendSignal('hangup');
    }
    teardownConnection();
    resetCallUI();
  }

  function toggleMute(){
    if(!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    const muted = !track.enabled;
    [muteBtn, muteBtnAudio].forEach(b => {
      b.classList.toggle('off', muted);
      b.innerHTML = muted ? ICON_MIC_OFF : ICON_MIC;
    });
  }

  function toggleCam(){
    if(!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    camBtn.classList.toggle('off', !track.enabled);
    camBtn.innerHTML = track.enabled ? ICON_CAM : ICON_CAM_OFF;
  }

  async function pollSignals(){
    const sigs = await fetchSignals();
    for(const s of sigs){
      if(seenSignalIds.has(s.id)) continue;
      seenSignalIds.add(s.id);
      if(s.sender === myName) continue;

      if(s.type === 'offer'){
        if(callState !== 'idle'){
          // busy — auto-decline
          fetch('/api/signal', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ room, sender: myName, type: 'busy', callId: s.callId })
          });
          continue;
        }
        showIncomingCall(s);
        continue;
      }

      if(s.callId !== currentCallId) continue; // signal for a different/stale call

      if(s.type === 'answer' && callState === 'calling' && pc){
        await pc.setRemoteDescription(new RTCSessionDescription(s.sdp));
        for(const c of pendingCandidates){
          try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
        }
        pendingCandidates = [];
      }else if(s.type === 'candidate'){
        if(pc && pc.remoteDescription && pc.remoteDescription.type){
          try{ await pc.addIceCandidate(new RTCIceCandidate(s.candidate)); }catch(e){}
        }else{
          pendingCandidates.push(s.candidate);
        }
      }else if(s.type === 'hangup' || s.type === 'decline'){
        showToast(s.type === 'decline' ? 'Call declined' : 'Call ended');
        teardownConnection();
        resetCallUI();
      }else if(s.type === 'busy'){
        showToast(otherName() + ' is on another call');
        teardownConnection();
        resetCallUI();
      }
    }
  }

  voiceCallBtn.addEventListener('click', () => startOutgoingCall('audio'));
  videoCallBtn.addEventListener('click', () => startOutgoingCall('video'));
  cancelCallBtn.addEventListener('click', () => endCall(true));
  acceptCallBtn.addEventListener('click', acceptIncomingCall);
  declineCallBtn.addEventListener('click', declineIncomingCall);
  hangupBtnAudio.addEventListener('click', () => endCall(true));
  hangupBtnVideo.addEventListener('click', () => endCall(true));
  muteBtn.addEventListener('click', toggleMute);
  muteBtnAudio.addEventListener('click', toggleMute);
  camBtn.addEventListener('click', toggleCam);

  // ================= /Calling =================

  function renderAll(list){
    messagesEl.innerHTML = '';
    renderedIds = new Set();
    list.forEach(m => { if(hiddenLocalIds.has(m.id)) renderedIds.add(m.id); });
    const visible = list.filter(m => !hiddenLocalIds.has(m.id));
    if(visible.length === 0){
      messagesEl.appendChild(emptyState);
      return;
    }
    visible.forEach(addBubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(m, isSending){
    renderedIds.add(m.id);
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.sender === myName ? 'mine' : 'theirs') + (isSending ? ' img-sending' : '');
    if(!isSending) wrap.dataset.id = m.id;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const metaText = document.createElement('span');
    metaText.textContent = (m.sender === myName ? 'You' : m.sender) + ' · ' + (isSending ? 'Sending…' : fmtClock(m.ts));
    meta.appendChild(metaText);

    let menu = null;
    if(!isSending){
      const replyBtn = document.createElement('button');
      replyBtn.className = 'reply-btn';
      replyBtn.type = 'button';
      replyBtn.textContent = '↩ reply';
      replyBtn.addEventListener('click', () => setReplyTarget(m));
      meta.appendChild(replyBtn);

      const menuBtn = document.createElement('button');
      menuBtn.className = 'menu-btn';
      menuBtn.type = 'button';
      menuBtn.textContent = '⋮';
      menuBtn.title = 'Message options';
      meta.appendChild(menuBtn);

      menu = document.createElement('div');
      menu.className = 'msg-menu';

      const delMeBtn = document.createElement('button');
      delMeBtn.type = 'button';
      delMeBtn.className = 'msg-menu-item';
      delMeBtn.textContent = 'Delete for me';
      delMeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAllMsgMenus();
        deleteForMe(m.id);
      });
      menu.appendChild(delMeBtn);

      if(m.sender === myName){
        const delAllBtn = document.createElement('button');
        delAllBtn.type = 'button';
        delAllBtn.className = 'msg-menu-item danger';
        delAllBtn.textContent = 'Delete for everyone';
        delAllBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMsgMenus();
          deleteForEveryone(m.id);
        });
        menu.appendChild(delAllBtn);
      }

      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = menu.classList.contains('show');
        closeAllMsgMenus();
        if(!wasOpen) menu.classList.add('show');
      });
    }

    let quote = null;
    if(m.replyTo){
      quote = document.createElement('div');
      quote.className = 'quote';
      const qb = document.createElement('b');
      qb.textContent = m.replyTo.sender + ': ';
      quote.appendChild(qb);
      quote.appendChild(document.createTextNode(m.replyTo.text));
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (m.image ? ' has-image' : '') + (m.audio ? ' has-audio' : '');
    if(m.audio){
      // Server-stored messages carry `duration`; locally-built optimistic
      // bubbles carry `audioDuration`. Read both so a voice note fetched back
      // from the server shows its real length instead of 0:00.
      bubble.appendChild(buildVoicePlayer(m.audio, m.duration || m.audioDuration || 0, isSending));
    }else if(m.image){
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.loading = 'lazy';
      img.src = m.image;
      img.alt = 'photo';
      if(!isSending) img.addEventListener('click', () => openLightbox(m.image));
      bubble.appendChild(img);
      if(m.text){
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = m.text;
        bubble.appendChild(cap);
      }
    }else{
      bubble.textContent = m.text;
    }

    const fuse = document.createElement('div');
    fuse.className = 'fuse';
    const fill = document.createElement('div');
    fill.className = 'fuse-fill';
    const now = Date.now();
    const elapsedFrac = Math.min(1, (now - m.ts) / LIFETIME_MS);
    const remainMs = Math.max(0, LIFETIME_MS - (now - m.ts));
    fill.style.width = (elapsedFrac * 100) + '%';
    fuse.appendChild(fill);

    wrap.appendChild(meta);
    if(menu) wrap.appendChild(menu);
    if(quote) wrap.appendChild(quote);
    wrap.appendChild(bubble);

    if(m.sender === myName && !isSending){
      const statusEl = document.createElement('div');
      statusEl.className = 'msg-status';
      statusEl.textContent = getMessageStatusText(m);
      wrap.appendChild(statusEl);
    }

    if(!isSending) wrap.appendChild(fuse);
    messagesEl.appendChild(wrap);

    if(isSending) return wrap;

    requestAnimationFrame(() => {
      fill.style.transition = 'width ' + remainMs + 'ms linear';
      requestAnimationFrame(() => { fill.style.width = '100%'; });
    });

    setTimeout(() => {
      wrap.remove();
      renderedIds.delete(m.id);
      if(messagesEl.children.length === 0) messagesEl.appendChild(emptyState);
    }, remainMs + 200);

    return wrap;
  }

  function appendNew(list){
    let added = false;
    list.forEach(m => {
      if(hiddenLocalIds.has(m.id)){
        renderedIds.add(m.id);
        return;
      }
      if(!renderedIds.has(m.id)){
        if(emptyState.parentNode) emptyState.remove();
        addBubble(m);
        added = true;
        if(m.sender !== myName) notifyIncoming(m);
      } else {
        updateMessageStatusInDOM(m);
      }
    });
    if(added) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function reconcileDeleted(freshList){
    // Anything we've rendered that's no longer in the server's list was
    // deleted "for everyone" (by us or the other person) — remove it here
    // too. Messages hidden only via "delete for me" are skipped, since the
    // server never removed those and they should stay hidden, not "come
    // back" as a deletion.
    const freshIds = new Set(freshList.map(m => m.id));
    renderedIds.forEach(id => {
      if(typeof id === 'string' && id.indexOf('sending-') === 0) return;
      if(hiddenLocalIds.has(id)) return;
      if(!freshIds.has(id)) removeRenderedMessage(id);
    });
  }

  async function poll(){
    const fresh = await fetchMessages();

    // Mark incoming messages as seen
    const unseenIds = fresh
      .filter(m => m.sender !== myName && (!m.seenBy || !m.seenBy.some(s => s.name === myName)))
      .map(m => m.id);
    if(unseenIds.length > 0){
      // Deliberately not awaited. The receipt is for the other person's
      // benefit, so blocking our own render on that round-trip delayed every
      // incoming message by the latency of a second request.
      markAsSeen(unseenIds);
    }

    appendNew(fresh);
    reconcileDeleted(fresh);
    pollSignals();
  }

  // Polling is the app's entire transport, so it has to be startable and
  // stoppable — left running unconditionally it keeps hitting the network
  // every 2s while the phone is in your pocket, which drains the battery and
  // burns through the Upstash request quota for nothing.
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(poll, 2000);
    presenceTimer = setInterval(pollPresence, 10000);
  }

  function stopPolling(){
    clearInterval(pollTimer);
    pollTimer = null;
    clearInterval(presenceTimer);
    presenceTimer = null;
  }

  document.addEventListener('visibilitychange', () => {
    if(!room) return;
    if(document.hidden){
      // Mid-call the signalling loop must stay alive, or a hangup or a late
      // ICE candidate from the other side is never seen. Otherwise stand down.
      if(callState === 'idle') stopPolling();
    }else{
      startPolling();
      poll();
      pollPresence();
    }
  });

  enterBtn.addEventListener('click', async () => {
    errMsg.textContent = '';
    unlockAudio();
    const nm = nameInput.value.trim();
    const rm = slugRoom(roomInput.value);
    if(!nm){ errMsg.textContent = 'Enter your name.'; return; }
    if(!rm){ errMsg.textContent = 'Enter a room code.'; return; }

    myName = nm;
    room = rm;
    roomLabel.textContent = room;
    peerAvatar.textContent = room.charAt(0).toUpperCase();
    loadHiddenLocalIds();

    landing.classList.add('hidden');
    chatwrap.classList.add('active');

    const fresh = await fetchMessages();
    renderAll(fresh);

    startPolling();
    pollPresence();
    msgInput.focus();

    // If notification permission was already granted in a previous visit,
    // silently (re)subscribe this device for push so it stays current.
    if('Notification' in window && Notification.permission === 'granted'){
      notifyEnabled = true;
      bellBtn.classList.add('on');
      subscribeForPush();
    }
  });

  roomInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') enterBtn.click(); });

  bellBtn.addEventListener('click', async () => {
    if(!('Notification' in window)){
      showToast('Notifications not supported in this browser');
      return;
    }
    if(Notification.permission === 'granted'){
      notifyEnabled = !notifyEnabled;
      bellBtn.classList.toggle('on', notifyEnabled);
      if(notifyEnabled){
        const ok = await subscribeForPush();
        showToast(ok ? 'Notifications on' : 'Notifications on (background push not set up — see README)');
      }else{
        unsubscribeFromPush();
        showToast('Notifications off');
      }
      return;
    }
    const perm = await Notification.requestPermission();
    notifyEnabled = perm === 'granted';
    bellBtn.classList.toggle('on', notifyEnabled);
    if(notifyEnabled){
      const ok = await subscribeForPush();
      showToast(ok ? 'Notifications on' : 'Notifications on (background push not set up — see README)');
    }else{
      showToast('Notifications blocked');
    }
  });

  cancelReply.addEventListener('click', clearReplyTarget);

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(composer.classList.contains('recording')) return;
    const text = msgInput.value.trim();
    if(!text) return;
    msgInput.value = '';
    const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, text: replyingTo.text } : null;
    clearReplyTarget();

    if(emptyState.parentNode) emptyState.remove();
    const tempId = 'sending-' + Date.now();
    const tempWrap = addBubble({ id: tempId, sender: myName, text, ts: Date.now() }, true);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const m = await postMessage(text, replyPayload);
    if(tempWrap && tempWrap.parentNode) tempWrap.remove();

    if(m && m.error){
      showToast(m.error);
      return;
    }
    if(m && !renderedIds.has(m.id)){
      if(emptyState.parentNode) emptyState.remove();
      addBubble(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
