<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanish — chat that burns away</title>

<!-- PWA: installable as a home-screen app -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#10131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanish">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10131a;
    --panel:#171b25;
    --panel-2:#1e2330;
    --ember:#ff7a45;
    --ember-dim:#c75a2e;
    --ash:#8b93a6;
    --paper:#eef0f4;
    --line:#2a2f3d;
    --good:#5ecb96;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1a1f2c 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #1a1712 0%, transparent 40%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .landing{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 32px;
    position:relative;
    overflow:hidden;
  }
  .landing::before{
    content:"";
    position:absolute;
    top:-40%; right:-30%;
    width:260px; height:260px;
    background:radial-gradient(circle, rgba(255,122,69,0.16), transparent 70%);
    pointer-events:none;
  }
  .brand-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .brand-mark{
    width:26px;height:26px;border-radius:8px;background:var(--ember);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ember);
  }
  h1{
    font-family:'Space Mono',monospace;
    font-size:26px;
    font-weight:700;
    margin:0 0 12px 0;
    line-height:1.3;
  }
  .sub{color:var(--ash);font-size:14px;line-height:1.65;margin-bottom:8px;}
  label{
    display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ash);margin-bottom:7px;margin-top:22px;
  }
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;color:var(--paper);font-family:'Inter',sans-serif;font-size:15px;
    outline:none;transition:border-color .15s ease;
  }
  input[type=text]:focus{border-color:var(--ember);}
  .hint{font-size:12px;color:var(--ash);margin-top:6px;}
  .btn{
    margin-top:26px;width:100%;background:var(--ember);border:none;border-radius:8px;
    color:#1a0f08;font-weight:600;font-size:15px;padding:13px;cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:#ff8c5e;}
  .btn:active{transform:scale(0.98);}
  .err{color:#ff8080;font-size:13px;margin-top:10px;min-height:16px;}

  .chatwrap{
    width:100%;max-width:560px;height:88vh;max-height:760px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;overflow:hidden;
    position:relative;
  }
  .chatwrap.active{display:flex;}
  .landing.hidden{display:none;}

  header.chatbar{
    padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;background:var(--panel-2);gap:12px;
  }
  .chatbar-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .chatbar-left{flex-direction:column;align-items:flex-start;gap:2px;}
  .room-tag{
    font-family:'Space Mono',monospace;font-size:13px;color:var(--paper);letter-spacing:0.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:9px;
  }
  .room-tag b{color:var(--ember);font-weight:400;}
  .presence-label{
    font-size:11.5px;color:var(--ash);display:flex;align-items:center;gap:5px;height:14px;
  }
  .presence-label .pdot{width:7px;height:7px;border-radius:50%;background:var(--ash);flex-shrink:0;}
  .presence-label.online{color:var(--good);}
  .presence-label.online .pdot{background:var(--good);box-shadow:0 0 5px var(--good);}
  .status-dot{
    width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);
    flex-shrink:0;cursor:default;
  }
  .toolbar{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .icon-btn{
    background:none;border:none;color:var(--ash);width:38px;height:38px;border-radius:10px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.06);color:var(--paper);}
  .icon-btn.on{color:var(--ember);background:rgba(255,122,69,0.12);}
  .icon-btn svg{width:18px;height:18px;}
  .toolbar-divider{width:1px;height:22px;background:var(--line);margin:0 4px;}

  /* ---------- Call overlay ---------- */
  .call-overlay{
    position:absolute;inset:0;background:rgba(10,12,17,0.97);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;z-index:20;padding:24px;text-align:center;
  }
  .call-overlay.show{display:flex;}
  .call-avatar{
    width:88px;height:88px;border-radius:50%;background:var(--panel-2);border:2px solid var(--ember-dim);
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;
    font-size:30px;color:var(--ember);
  }
  .call-avatar.pulse{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,122,69,0.35);}
    50%{box-shadow:0 0 0 16px rgba(255,122,69,0);}
  }
  .call-name{font-family:'Space Mono',monospace;font-size:18px;}
  .call-status{font-size:13px;color:var(--ash);}
  .call-timer{font-family:'Space Mono',monospace;font-size:13px;color:var(--good);}
  .call-video-wrap{position:relative;width:100%;height:100%;display:none;}
  .call-video-wrap.show{display:block;}
  video.remote-video{width:100%;height:100%;object-fit:cover;border-radius:12px;background:#000;}
  video.local-video{
    position:absolute;bottom:18px;right:18px;width:110px;height:82px;object-fit:cover;
    border-radius:8px;border:1px solid var(--line);background:#000;
  }
  .call-controls{display:flex;gap:16px;align-items:center;z-index:1;}
  .call-btn{
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease;
  }
  .call-btn:active{transform:scale(0.92);}
  .call-btn.mute-tgl, .call-btn.cam-tgl{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);}
  .call-btn.mute-tgl.off, .call-btn.cam-tgl.off{background:var(--ember);color:#1a0f08;border-color:var(--ember);}
  .call-btn.hangup{background:#e5484d;color:#fff;}
  .call-btn.accept{background:var(--good);color:#0c1a12;}
  .call-btn.decline{background:#e5484d;color:#fff;}
  .call-controls-row{display:flex;gap:20px;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1;}

  .incoming-actions{display:flex;gap:22px;}
  #outgoingControls, #incomingControls, #connectedControls{display:none;}
  #outgoingControls.show, #incomingControls.show, #connectedControls.show{display:flex;}
  #callAudioUi{display:flex;flex-direction:column;align-items:center;gap:14px;}

  .toast{
    position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);
    background:var(--panel-2);border:1px solid var(--ember-dim);border-radius:10px;padding:9px 16px;
    font-size:13px;color:var(--paper);opacity:0;pointer-events:none;transition:all .25s ease;z-index:5;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .empty{margin:auto;text-align:center;color:var(--ash);font-size:13px;line-height:1.7;}
  .empty .big{font-family:'Space Mono',monospace;font-size:15px;color:var(--paper);display:block;margin-bottom:4px;}

  .msg{max-width:78%;display:flex;flex-direction:column;gap:6px;position:relative;}
  .msg.mine{align-self:flex-end;align-items:flex-end;}
  .msg.theirs{align-self:flex-start;align-items:flex-start;}
  .meta{font-size:11px;color:var(--ash);font-family:'Space Mono',monospace;display:flex;align-items:center;gap:8px;}
  .reply-btn{
    background:none;border:none;color:var(--ash);font-size:11px;cursor:pointer;padding:0;
    opacity:0;transition:opacity .15s ease;font-family:'Inter',sans-serif;
  }
  .msg:hover .reply-btn{opacity:1;}
  .reply-btn:hover{color:var(--ember);}
  .quote{
    font-size:12px;color:var(--ash);border-left:2px solid var(--ember-dim);padding:4px 10px;
    margin-bottom:6px;border-radius:4px;background:rgba(255,122,69,0.06);max-width:100%;
  }
  .quote b{color:var(--paper);}
  .bubble{padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;}
  .msg.mine .bubble{background:var(--ember);color:#1a0f08;border-bottom-right-radius:3px;}
  .msg.theirs .bubble{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:3px;}

  .bubble.image-bubble{padding:5px;background:var(--panel-2);border:1px solid var(--line);}
  .msg.mine .bubble.image-bubble{background:var(--panel-2);border:1px solid var(--line);}
  .bubble.image-bubble img{display:block;max-width:220px;max-height:280px;width:100%;height:auto;border-radius:8px;cursor:zoom-in;object-fit:cover;}
  .bubble.image-bubble .caption{padding:8px 6px 3px;font-size:14px;color:var(--paper);white-space:pre-wrap;}

  .status-line{font-size:10.5px;color:var(--ash);font-family:'Space Mono',monospace;margin-top:1px;}
  .status-line.seen{color:var(--good);}

  .img-lightbox{
    position:fixed;inset:0;background:rgba(6,7,10,0.92);display:none;align-items:center;justify-content:center;
    z-index:50;padding:24px;cursor:zoom-out;
  }
  .img-lightbox.show{display:flex;}
  .img-lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

  .fuse{width:100%;height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .fuse-fill{height:100%;background:linear-gradient(90deg, var(--ember-dim), var(--ember));width:0%;}

  .reply-preview{
    display:none;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 16px;background:var(--panel-2);border-top:1px solid var(--line);
  }
  .reply-preview.show{display:flex;}
  .reply-preview .info{font-size:12px;color:var(--ash);border-left:2px solid var(--ember);padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reply-preview .info b{color:var(--paper);}
  .reply-preview button{background:none;border:none;color:var(--ash);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0;}
  .reply-preview button:hover{color:var(--paper);}

  form.composer{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);background:var(--panel-2);}
  .composer input{
    flex:1;background:var(--ink);border:1px solid var(--line);border-radius:24px;
    padding:12px 18px;color:var(--paper);font-size:14.5px;outline:none;
  }
  .composer input:focus{border-color:var(--ember);}
  .send{
    background:var(--ember);border:none;color:#1a0f08;width:44px;height:44px;border-radius:50%;
    font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .send:hover{background:#ff8c5e;}
  .send:active{transform:scale(0.94);}

  .attach-btn{
    background:none;border:1px solid var(--line);color:var(--ash);width:44px;height:44px;border-radius:50%;
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .attach-btn:hover{color:var(--ember);border-color:var(--ember-dim);}
  .attach-btn svg{width:19px;height:19px;}
  .attach-btn:disabled{opacity:0.5;cursor:default;}

  @media (prefers-reduced-motion: reduce){ .fuse-fill{transition:none !important;} }
</style>
</head>
<body>

  <div class="landing" id="landing">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="var(--ink)"><path d="M12 2c2 3 4.5 5 4.5 8.5a4.5 4.5 0 0 1-9 0c0-1.3.5-2.3 1.2-3.3.2 1 .9 1.6 1.6 1.6.9 0 1-1 .7-1.8-.5-1.3-.4-2.9 1-5z"/></svg>
      </div>
      <div class="brand">Vanish</div>
    </div>
    <h1>Chat that disappears<br>after an hour.</h1>
    <div class="sub">Share a room code with your friend — anything you type is gone for good 60 minutes after it's sent.</div>

    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Sam" maxlength="24">

    <label for="roomInput">Room code</label>
    <input type="text" id="roomInput" placeholder="a word only you two know" maxlength="40">
    <div class="hint">Both of you enter the same code to land in the same room.</div>

    <button class="btn" id="enterBtn">Enter room</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="chatwrap" id="chatwrap">
    <header class="chatbar">
      <div class="chatbar-left">
        <div class="room-tag">
          <span class="status-dot" title="Messages vanish 1 hour after they're sent"></span>
          <b>room</b> · <span id="roomLabel"></span>
        </div>
        <div class="presence-label" id="presenceLabel"></div>
      </div>
      <div class="toolbar">
        <button class="icon-btn" id="voiceCallBtn" type="button" title="Voice call" aria-label="Voice call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="icon-btn" id="videoCallBtn" type="button" title="Video call" aria-label="Video call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2.5"/></svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="icon-btn" id="bellBtn" type="button" title="Toggle notifications" aria-label="Toggle notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </header>
    <div class="toast" id="toast"></div>

    <div class="call-overlay" id="callOverlay">
      <div class="call-video-wrap" id="callVideoWrap">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <video id="localVideo" class="local-video" autoplay playsinline muted></video>
        <div class="call-controls-row">
          <button class="call-btn mute-tgl" id="muteBtn" type="button" title="Mute"><span class="ico-mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span></button>
          <button class="call-btn cam-tgl" id="camBtn" type="button" title="Camera"><span class="ico-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2.5"/></svg></span></button>
          <button class="call-btn hangup" id="hangupBtnVideo" type="button" title="Hang up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg></button>
        </div>
      </div>
      <div id="callAudioUi">
        <div class="call-avatar" id="callAvatar"></div>
        <div class="call-name" id="callName"></div>
        <div class="call-status" id="callStatus"></div>
        <div class="call-timer" id="callTimer"></div>
        <audio id="remoteAudio" autoplay></audio>
        <div id="outgoingControls" class="call-controls">
          <button class="call-btn hangup" id="cancelCallBtn" type="button" title="Cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="incomingControls" class="incoming-actions">
          <button class="call-btn accept" id="acceptCallBtn" type="button" title="Accept"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="call-btn decline" id="declineCallBtn" type="button" title="Decline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="connectedControls" class="call-controls">
          <button class="call-btn mute-tgl" id="muteBtnAudio" type="button" title="Mute"><span class="ico-mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span></button>
          <button class="call-btn hangup" id="hangupBtnAudio" type="button" title="Hang up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg></button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty" id="emptyState"><span class="big">Nothing here yet</span>Say something — it'll stick around for an hour.</div>
    </div>
    <div class="reply-preview" id="replyPreview">
      <div class="info">Replying to <b id="replyPreviewName"></b>: <span id="replyPreviewText"></span></div>

  const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

  function slugRoom(r){ return r.trim().toLowerCase().replace(/\s+/g,'-').slice(0,60); }

  async function fetchMessages(){
    try{
      const res = await fetch('/api/messages?room=' + encodeURIComponent(room));

      return await res.json();
    }catch(e){ return []; }

  async function postMessage(text, replyTo, image){
    try{
      const res = await fetch('/api/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({room, sender: myName, text, replyTo: replyTo || null, image: image || null})
      });
      const data = await res.json().catch(() => null);
      if(!res.ok){
        return { __error: (data && data.error) ? data.error : ('server error ' + res.status) };
      }
      return data;
    }catch(e){ return { __error: 'network error: ' + e.message }; }
  }

  // Shrinks + re-encodes a picked image client-side before it ever hits the
  // network, so a phone photo doesn't turn into an 8MB request. Returns a
  // JPEG data URL (PNGs with transparency get flattened onto white).
  function resizeImageFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode failed'));
        img.onload = () => {
          let { width, height } = img;
          if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
            const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', IMAGE_JPEG_QUALITY));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function sendImage(file){
    if(!file || !file.type.startsWith('image/')){
      showToast('That file isn\'t an image');
      return;
    }
    attachBtn.disabled = true;
    try{
      const dataUrl = await resizeImageFile(file);
      if(dataUrl.length > 600000){
        showToast('That image is too large, even after compressing');
        return;
      }
      const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, text: replyingTo.text } : null;
      clearReplyTarget();
      const m = await postMessage('', replyPayload, dataUrl);
      if(m && !m.__error && !renderedIds.has(m.id)){
        if(emptyState.parentNode) emptyState.remove();
        addBubble(m);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }else{
        showToast('Photo failed: ' + (m && m.__error ? m.__error : 'unknown error'));
        console.error('Photo send failed:', m && m.__error);
      }
    }catch(e){
      showToast('Couldn\'t process that photo');
    }finally{
      attachBtn.disabled = false;
    }
  }

  function fmtClock(ts){
    return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function unlockAudio(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){ /* ignore */ }
  }

  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }catch(e){ /* audio not available, ignore */ }
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  let titleFlashTimer = null;
  function flashTitle(text){
    let on = true;
    clearInterval(titleFlashTimer);
    document.title = text;
    titleFlashTimer = setInterval(() => {
      document.title = on ? baseTitle : text;
      on = !on;
    }, 1200);
    const stop = () => {
      clearInterval(titleFlashTimer);
      document.title = baseTitle;
      window.removeEventListener('focus', stop);
    };
    window.addEventListener('focus', stop);
  }

  function notifyIncoming(m){
    beep();
    const preview = m.type === 'image' ? ('📷 ' + (m.text || 'Photo')) : m.text;
    showToast(m.sender + ': ' + (preview.length > 60 ? preview.slice(0,60) + '…' : preview));
    if(document.hidden || !document.hasFocus()){
      flashTitle('💬 New message');
      // NOTE: this in-page Notification only fires while this tab/app is
      // actually alive and running. It's a nice-to-have for desktop tabs.
      // Real background notifications (phone locked, app closed) come
      // through the service worker's 'push' handler instead — see
      // subscribeForPush() below.
      if(notifyEnabled && 'Notification' in window && Notification.permission === 'granted'){
        try{
          const n = new Notification(m.sender + ' — ' + room, { body: preview, tag: 'vanish-' + room });
          n.onclick = () => { window.focus(); n.close(); };
        }catch(e){ /* ignore */ }
      }
    }
  }

  function setReplyTarget(m){
    const previewText = m.type === 'image' ? (m.text ? '📷 ' + m.text : '📷 Photo') : m.text;
    replyingTo = { id: m.id, sender: (m.sender === myName ? 'You' : m.sender), text: previewText };

    replyPreviewText.textContent = replyingTo.text.length > 80 ? replyingTo.text.slice(0,80) + '…' : replyingTo.text;

  // ================= Seen receipts =================

  function queueSeen(m){
    if(m.sender === myName) return;                 // never mark my own messages
    if(seenSentIds.has(m.id)) return;                // already told the server
    if(m.seenBy && m.seenBy.some(s => s.name === myName)) { seenSentIds.add(m.id); return; }
    pendingSeenIds.push(m.id);
  }

  async function flushSeenIfVisible(){
    if(document.hidden || !pendingSeenIds.length) return;
    const ids = pendingSeenIds.splice(0, pendingSeenIds.length);
    ids.forEach(id => seenSentIds.add(id));
    try{
      await fetch('/api/messages', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: 'seen', room, viewer: myName, ids })
      });
    }catch(e){ /* ignore — will just stay marked "sent" for the other side */ }
  }

  document.addEventListener('visibilitychange', flushSeenIfVisible);
  window.addEventListener('focus', flushSeenIfVisible);

  function statusTextFor(m){
    if(m.seenBy && m.seenBy.length){
      const last = m.seenBy[m.seenBy.length - 1];
      return { text: 'Seen ' + fmtClock(last.ts), seen: true };
    }
    return { text: 'Sent', seen: false };

  function applyStatusUpdates(list){
    list.forEach(m => {
      if(m.sender === myName && mineStatusEls.has(m.id)){
        const el = mineStatusEls.get(m.id);

  // ================= Presence (online / active) =================

  function fmtRelativeTime(ts){
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if(s < 20) return 'just now';
    if(s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if(m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    return h + 'h ago';
  }

  // ================= Push notifications (real, background-capable) =================

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for(let i = 0; i < rawData.length; ++i){
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Registers this device to receive push notifications for `room` as
  // `myName`, even if the app is closed or the phone is locked. Requires:
  //  - HTTPS (Vercel gives you this automatically)
  //  - VAPID_PUBLIC_KEY set above, matching the server env vars
  //  - On iPhone: the app must be added to the Home Screen and opened from
  //    that icon (not a Safari tab), iOS 16.4+.
  async function subscribeForPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      return false; // browser doesn't support push at all
    }
    if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.indexOf('PASTE_YOUR') === 0){
      return false; // server owner hasn't configured push yet
    }
    try{
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room, sender: myName, subscription: sub })
      });
      return true;
    }catch(e){
      console.error('push subscribe failed', e);
      return false;
    }
  }

  async function unsubscribeFromPush(){
    try{
      if('serviceWorker' in navigator){
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if(sub) await sub.unsubscribe();
      }
      await fetch('/api/subscribe', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room, sender: myName })
      });
    }catch(e){ /* ignore */ }
  }

  // ================= Calling =================

  let incomingOfferSig = null;

  async function sendSignal(type, extra){
    try{
      await fetch('/api/signal', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({
          room, sender: myName, type, callId: currentCallId

    try{
      const res = await fetch('/api/signal?room=' + encodeURIComponent(room));
      if(!res.ok) return [];
      return await res.json();

  function otherName(){
    return callName.dataset.other || 'them';
  }

  function callIcon(type){ return type === 'video' ? ICON_VIDEO : ICON_PHONE; }

  function showOverlay(){ callOverlay.classList.add('show'); }
  function hideOverlay(){ callOverlay.classList.remove('show'); }

  function setPanel(which){
    [outgoingControls, incomingControls, connectedControls].forEach(el => el.classList.remove('show'));
    if(which) which.classList.add('show');

  function startRingback(){
    stopRingback();
    beep();
    ringTimer = setInterval(beep, 1600);
  }
  function stopRingback(){
    clearInterval(ringTimer);
    ringTimer = null;
  }

  function startCallTimer(){
    callStartTs = Date.now();
    callTimerInterval = setInterval(() => {
      const s = Math.floor((Date.now() - callStartTs) / 1000);
      const mm = String(Math.floor(s / 60)).padStart(2,'0');
      const ss = String(s % 60).padStart(2,'0');
      callTimer.textContent = mm + ':' + ss;
    }, 500);
  }
  function stopCallTimer(){
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    callTimer.textContent = '';
  }

  function resetCallUI(){
    callState = 'idle';
    callDirection = null;
    incomingOfferSig = null;
    pendingCandidates = [];
    stopRingback();
    stopCallTimer();
    clearTimeout(callTimeoutTimer);
    setPanel(null);
    callVideoWrap.classList.remove('show');
    callAudioUi.style.display = 'flex';
    remoteVideo.srcObject = null;
    localVideo.srcObject = null;
    remoteAudio.srcObject = null;
    callAvatar.classList.remove('pulse');
    [muteBtn, muteBtnAudio].forEach(b => { b.classList.remove('off'); b.innerHTML = ICON_MIC; });
    camBtn.classList.remove('off');
    camBtn.innerHTML = ICON_CAM;
    hideOverlay();
  }

  function teardownConnection(){
    if(pc){
      try{ pc.close(); }catch(e){}
      pc = null;
    }
    if(localStream){
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
  }

  function createPeerConnection(){
    const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    conn.onicecandidate = (e) => {
      if(e.candidate){
        sendSignal('candidate', { candidate: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate });
      }
    };
    conn.ontrack = (e) => {
      const stream = e.streams[0];
      if(callTypeActive === 'video'){
        remoteVideo.srcObject = stream;
      }else{
        remoteAudio.srcObject = stream;
      }
    };
    conn.onconnectionstatechange = () => {
      if(conn.connectionState === 'connected' && callState !== 'connected'){
        callState = 'connected';
        stopRingback();
        callStatus.textContent = 'Connected';
        setPanel(callTypeActive === 'video' ? null : connectedControls);
        if(callTypeActive === 'video'){
          callVideoWrap.classList.add('show');
          callAudioUi.style.display = 'none';
        }
        startCallTimer();
      }
      if(['failed','disconnected','closed'].includes(conn.connectionState) && callState !== 'idle'){
        showToast('Call ended');
        endCall(false);
      }
    };
    return conn;
  }

  async function getMedia(type){
    const constraints = type === 'video'
      ? { audio: true, video: { width: 480, height: 360 } }
      : { audio: true, video: false };
    return navigator.mediaDevices.getUserMedia(constraints);
  }

  async function startOutgoingCall(type){
    if(callState !== 'idle'){ showToast('Already in a call'); return; }
    unlockAudio();
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
      showToast('This browser/site can\'t access mic or camera (needs HTTPS).');
      return;
    }
    currentCallId = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    callDirection = 'outgoing';
    callState = 'calling';
    callTypeActive = type;
    seenSignalIds = new Set();

    callName.dataset.other = '';
    callName.textContent = 'Calling…';
    callStatus.textContent = type === 'video' ? 'Video call' : 'Voice call';
    callAvatar.innerHTML = callIcon(type);
    callAvatar.classList.add('pulse');
    callVideoWrap.classList.remove('show');
    callAudioUi.style.display = 'flex';
    setPanel(outgoingControls);
    showOverlay();
    startRingback();

    try{
      localStream = await getMedia(type);
    }catch(e){
      showToast('Couldn\'t access mic/camera — check browser permissions.');
      resetCallUI();
      return;
    }
    if(type === 'video'){ localVideo.srcObject = localStream; }

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal('offer', { sdp: offer, callType: type });

    callTimeoutTimer = setTimeout(() => {
      if(callState === 'calling'){
        showToast('No answer');
        sendSignal('hangup');
        endCall(false);
      }
    }, 45000);
  }

  function showIncomingCall(sig){
    incomingOfferSig = sig;
    currentCallId = sig.callId;
    callDirection = 'incoming';
    callState = 'ringing';
    callTypeActive = sig.callType || 'audio';

    callName.dataset.other = sig.sender;
    callName.textContent = sig.sender;
    callStatus.textContent = (callTypeActive === 'video' ? 'Video call' : 'Voice call') + ' — incoming';
    callAvatar.innerHTML = callIcon(callTypeActive);
    callAvatar.classList.add('pulse');
    callVideoWrap.classList.remove('show');
    callAudioUi.style.display = 'flex';
    setPanel(incomingControls);
    showOverlay();
    startRingback();
    beep();

    callTimeoutTimer = setTimeout(() => {
      if(callState === 'ringing'){
        endCall(false);
      }
    }, 45000);
  }

  async function acceptIncomingCall(){
    if(!incomingOfferSig) return;
    unlockAudio();
    clearTimeout(callTimeoutTimer);
    stopRingback();
    callStatus.textContent = 'Connecting…';

    try{
      localStream = await getMedia(callTypeActive);
    }catch(e){
      showToast('Couldn\'t access mic/camera — check browser permissions.');
      sendSignal('decline');
      endCall(false);
      return;
    }
    if(callTypeActive === 'video'){ localVideo.srcObject = localStream; }

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(incomingOfferSig.sdp));
    for(const c of pendingCandidates){
      try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    }
    pendingCandidates = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal('answer', { sdp: answer });
    incomingOfferSig = null;
  }

  function declineIncomingCall(){
    sendSignal('decline');
    endCall(false);
  }

  function endCall(notifyPeer){
    if(notifyPeer && callState !== 'idle'){
      sendSignal('hangup');
    }
    teardownConnection();
    resetCallUI();
  }

  function toggleMute(){
    if(!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    const muted = !track.enabled;
    [muteBtn, muteBtnAudio].forEach(b => {
      b.classList.toggle('off', muted);
      b.innerHTML = muted ? ICON_MIC_OFF : ICON_MIC;
    });
  }

  function toggleCam(){
    if(!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if(!track) return;
    track.enabled = !track.enabled;
    camBtn.classList.toggle('off', !track.enabled);
    camBtn.innerHTML = track.enabled ? ICON_CAM : ICON_CAM_OFF;
  }

  async function pollSignals(){
    const sigs = await fetchSignals();
    for(const s of sigs){
      if(seenSignalIds.has(s.id)) continue;
      seenSignalIds.add(s.id);
      if(s.sender === myName) continue;

      if(s.type === 'offer'){
        if(callState !== 'idle'){
          // busy — auto-decline
          fetch('/api/signal', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ room, sender: myName, type: 'busy', callId: s.callId })
          });
          continue;
        }
        showIncomingCall(s);
        continue;
      }

      if(s.callId !== currentCallId) continue; // signal for a different/stale call

      if(s.type === 'answer' && callState === 'calling' && pc){
        await pc.setRemoteDescription(new RTCSessionDescription(s.sdp));
        for(const c of pendingCandidates){
          try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
        }
        pendingCandidates = [];
      }else if(s.type === 'candidate'){
        if(pc && pc.remoteDescription && pc.remoteDescription.type){
          try{ await pc.addIceCandidate(new RTCIceCandidate(s.candidate)); }catch(e){}
        }else{
          pendingCandidates.push(s.candidate);
        }
      }else if(s.type === 'hangup' || s.type === 'decline'){
        showToast(s.type === 'decline' ? 'Call declined' : 'Call ended');
        teardownConnection();
        resetCallUI();
      }else if(s.type === 'busy'){
        showToast(otherName() + ' is on another call');
        teardownConnection();
        resetCallUI();
      }
    }
  }

  voiceCallBtn.addEventListener('click', () => startOutgoingCall('audio'));
  videoCallBtn.addEventListener('click', () => startOutgoingCall('video'));
  cancelCallBtn.addEventListener('click', () => endCall(true));
  acceptCallBtn.addEventListener('click', acceptIncomingCall);
  declineCallBtn.addEventListener('click', declineIncomingCall);
  hangupBtnAudio.addEventListener('click', () => endCall(true));
  hangupBtnVideo.addEventListener('click', () => endCall(true));
  muteBtn.addEventListener('click', toggleMute);
  muteBtnAudio.addEventListener('click', toggleMute);
  camBtn.addEventListener('click', toggleCam);

  // ================= /Calling =================

  function renderAll(list){
    messagesEl.innerHTML = '';
    renderedIds = new Set();
    if(list.length === 0){
      messagesEl.appendChild(emptyState);
      return;
    }
    list.forEach(addBubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(m){
    renderedIds.add(m.id);
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.sender === myName ? 'mine' : 'theirs');

    const meta = document.createElement('div');
    meta.className = 'meta';
    const metaText = document.createElement('span');
    metaText.textContent = (m.sender === myName ? 'You' : m.sender) + ' · ' + fmtClock(m.ts);
    meta.appendChild(metaText);
    const replyBtn = document.createElement('button');
    replyBtn.className = 'reply-btn';
    replyBtn.type = 'button';
    replyBtn.textContent = '↩ reply';
    replyBtn.addEventListener('click', () => setReplyTarget(m));
    meta.appendChild(replyBtn);

    let quote = null;
    if(m.replyTo){
      quote = document.createElement('div');
      quote.className = 'quote';
      const qb = document.createElement('b');
      qb.textContent = m.replyTo.sender + ': ';
      quote.appendChild(qb);
      quote.appendChild(document.createTextNode(m.replyTo.text));
    }

    const bubble = document.createElement('div');
    if(m.type === 'image' && m.image){
      bubble.className = 'bubble image-bubble';
      const img = document.createElement('img');
      img.src = m.image;
      img.loading = 'lazy';
      img.alt = 'photo';
      img.addEventListener('click', () => openLightbox(m.image));
      bubble.appendChild(img);
      if(m.text){
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = m.text;
        bubble.appendChild(cap);
      }
    }else{
      bubble.className = 'bubble';
      bubble.textContent = m.text;
    }

    let statusEl = null;
    if(m.sender === myName){
      statusEl = document.createElement('div');
      statusEl.className = 'status-line';
      const st = statusTextFor(m);
      statusEl.textContent = st.text;
      statusEl.classList.toggle('seen', st.seen);
      mineStatusEls.set(m.id, statusEl);
    }else{
      queueSeen(m);
    }

    const fuse = document.createElement('div');
    fuse.className = 'fuse';
    const fill = document.createElement('div');
    fill.className = 'fuse-fill';
    const now = Date.now();
    const elapsedFrac = Math.min(1, (now - m.ts) / LIFETIME_MS);
    const remainMs = Math.max(0, LIFETIME_MS - (now - m.ts));
    fill.style.width = (elapsedFrac * 100) + '%';
    fuse.appendChild(fill);

    wrap.appendChild(meta);
    if(quote) wrap.appendChild(quote);
    wrap.appendChild(bubble);
    if(statusEl) wrap.appendChild(statusEl);
    wrap.appendChild(fuse);
    messagesEl.appendChild(wrap);

    requestAnimationFrame(() => {
      fill.style.transition = 'width ' + remainMs + 'ms linear';
      requestAnimationFrame(() => { fill.style.width = '100%'; });
    });

    setTimeout(() => {
      wrap.remove();
      mineStatusEls.delete(m.id);
      if(messagesEl.children.length === 0) messagesEl.appendChild(emptyState);
    }, remainMs + 200);
  }

  function appendNew(list){
    let added = false;
    list.forEach(m => {
      if(!renderedIds.has(m.id)){
        if(emptyState.parentNode) emptyState.remove();
        addBubble(m);
        added = true;
        if(m.sender !== myName) notifyIncoming(m);
      }
    });
    if(added) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function poll(){
    const fresh = await fetchMessages();
    appendNew(fresh);
    applyStatusUpdates(fresh);
    flushSeenIfVisible();
    pollSignals();
  }

  enterBtn.addEventListener('click', async () => {
    errMsg.textContent = '';
    unlockAudio();
    const nm = nameInput.value.trim();
    const rm = slugRoom(roomInput.value);
    if(!nm){ errMsg.textContent = 'Enter your name.'; return; }
    if(!rm){ errMsg.textContent = 'Enter a room code.'; return; }

    myName = nm;
    room = rm;
    roomLabel.textContent = room;

    landing.classList.add('hidden');
    chatwrap.classList.add('active');

    const fresh = await fetchMessages();
    renderAll(fresh);
    flushSeenIfVisible();
    startPresence();

    pollTimer = setInterval(poll, 2000);
    msgInput.focus();

    // If notification permission was already granted in a previous visit,
    // silently (re)subscribe this device for push so it stays current.
    if('Notification' in window && Notification.permission === 'granted'){
      notifyEnabled = true;
      bellBtn.classList.add('on');
      subscribeForPush();
    }
  });

  roomInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') enterBtn.click(); });

  bellBtn.addEventListener('click', async () => {
    if(!('Notification' in window)){
      showToast('Notifications not supported in this browser');
      return;
    }
    if(Notification.permission === 'granted'){
      notifyEnabled = !notifyEnabled;
      bellBtn.classList.toggle('on', notifyEnabled);
      if(notifyEnabled){
        const ok = await subscribeForPush();
        showToast(ok ? 'Notifications on' : 'Notifications on (background push not set up — see README)');
      }else{
        unsubscribeFromPush();
        showToast('Notifications off');
      }
      return;
    }
    const perm = await Notification.requestPermission();
    notifyEnabled = perm === 'granted';
    bellBtn.classList.toggle('on', notifyEnabled);
    if(notifyEnabled){
      const ok = await subscribeForPush();
      showToast(ok ? 'Notifications on' : 'Notifications on (background push not set up — see README)');
    }else{
      showToast('Notifications blocked');
    }
  });

  cancelReply.addEventListener('click', clearReplyTarget);

  attachBtn.addEventListener('click', () => {
    unlockAudio();
    imageInput.click();
  });
  imageInput.addEventListener('change', () => {
    const file = imageInput.files && imageInput.files[0];
    imageInput.value = ''; // allow picking the same file again later
    if(file) sendImage(file);
  });

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if(!text) return;
    msgInput.value = '';
    const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, text: replyingTo.text } : null;
    clearReplyTarget();
    const m = await postMessage(text, replyPayload);
    if(m && !m.__error && !renderedIds.has(m.id)){
      if(emptyState.parentNode) emptyState.remove();
      addBubble(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }else if(m && m.__error){
      showToast('Message failed: ' + m.__error);
      console.error('Message send failed:', m.__error);
    }
  });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
